name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Valida as mensagens do PR
        if: github.event_name == 'pull_request'
        run: >
          npx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: Valida o último commit
        if: github.event_name == 'push'
        run: npx commitlint --verbose --last

  quality:
    name: Qualidade, testes, links e Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:i18n
      - run: npm test

      - run: npm run build
      - run: npm run check:placeholders

      - name: Sobe o build de produção
        run: |
          npx next start -p 3000 &
          npx --yes wait-on@8 --timeout 60000 http://localhost:3000/pt

      - name: Verifica links quebrados
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml http://localhost:3000/pt http://localhost:3000/en
          fail: true

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Testes de hidratação (next dev)
        run: |
          npx next dev -p 3200 &
          npx --yes wait-on@8 --timeout 120000 http://localhost:3200/pt
          npm run test:hydration
        env:
          E2E_DEV_URL: http://localhost:3200

      - run: npx lhci autorun

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            playwright-report/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
